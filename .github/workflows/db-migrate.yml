name: Database migrations

# Applies supabase/migrations to a hosted Supabase project. Runs only when started by hand
# (Actions → Database migrations → Run workflow), never on pushes or pull requests, so
# untrusted pull requests never see these secrets.
#
# One-time setup by the owner (Settings → Environments): create the environments
# "staging" and "production"; give "production" required reviewers. In each environment
# add the variable SUPABASE_PROJECT_REF and the secrets SUPABASE_ACCESS_TOKEN (a personal
# access token from the Supabase dashboard) and SUPABASE_DB_PASSWORD (the project's
# database password). See docs/HOSTINGER_DEPLOYMENT.md.

on:
  workflow_dispatch:
    inputs:
      target:
        description: Which Supabase project to migrate
        type: choice
        options: [staging, production]
        default: staging
      dry_run:
        description: Only list the migrations that would be applied
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: db-migrate-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  migrate:
    name: Migrate ${{ inputs.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: ${{ inputs.target }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # GitHub-hosted runners have no IPv6, and the project's direct database host is
      # IPv6-only, so connect through the project's IPv4 connection pooler (session mode).
      - name: Resolve the pooler connection
        env:
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          user="postgres.$PROJECT_REF"
          candidates=""
          # Ask the Management API for the project's pooler host. Some access tokens are
          # refused here (HTTP 403), so fall back to the shared pooler hosts of the
          # project's region and keep the first one that accepts the login.
          status=$(curl -sS -o pooler.json -w '%{http_code}' -A supabase-db-migrate \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/config/database/pooler" || true)
          if [ "$status" = 200 ]; then
            candidates=$(jq -r '(map(select(.database_type == "PRIMARY")) + .)[0].db_host // empty' pooler.json)
          else
            echo "Pooler lookup returned HTTP $status; trying the region's shared pooler hosts."
          fi
          region=$(curl -sS -A supabase-db-migrate -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF" | jq -r '.region // empty' || true)
          region=${region:-${{ vars.SUPABASE_REGION || 'ap-southeast-1' }}}
          candidates="$candidates aws-1-$region.pooler.supabase.com aws-0-$region.pooler.supabase.com"
          rm -f pooler.json
          host=""
          for h in $candidates; do
            if PGPASSWORD="$SUPABASE_DB_PASSWORD" PGCONNECT_TIMEOUT=10 psql -h "$h" -p 5432 -U "$user" \
                 -d "dbname=postgres sslmode=require" -Atqc 'select 1' >/dev/null 2>psql.err; then
              host=$h; break
            fi
            echo "$h: $(head -c 200 psql.err)"
          done
          rm -f psql.err
          if [ -z "$host" ]; then echo "Could not log in through any pooler host." >&2; exit 1; fi
          password=$(jq -rn --arg p "$SUPABASE_DB_PASSWORD" '$p | @uri')
          echo "::add-mask::$password"
          url="postgresql://$user:$password@$host:5432/postgres"
          echo "::add-mask::$url"
          echo "DB_URL=$url" >> "$GITHUB_ENV"
          echo "Pooler: $host (user $user)"
      - name: Migrations that would be applied
        run: npx supabase db push --dry-run --db-url "$DB_URL"
      - name: Apply migrations
        if: ${{ !inputs.dry_run }}
        run: npx supabase db push --yes --db-url "$DB_URL"
