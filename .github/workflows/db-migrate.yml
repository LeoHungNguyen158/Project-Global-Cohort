name: Database migrations

# Applies supabase/migrations to a hosted Supabase project. Runs only when started by hand
# (Actions → Database migrations → Run workflow), never on pushes or pull requests, so
# untrusted pull requests never see these secrets.
#
# One-time setup by the owner (Settings → Environments): create the environments
# "staging" and "production"; give "production" required reviewers. In each environment
# add the variable SUPABASE_PROJECT_REF and the secrets SUPABASE_ACCESS_TOKEN (a personal
# access token from the Supabase dashboard) and SUPABASE_DB_PASSWORD (the project's
# database password). See docs/HOSTINGER_DEPLOYMENT.md.

on:
  workflow_dispatch:
    inputs:
      target:
        description: Which Supabase project to migrate
        type: choice
        options: [staging, production]
        default: staging
      dry_run:
        description: Only list the migrations that would be applied
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: db-migrate-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  migrate:
    name: Migrate ${{ inputs.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: ${{ inputs.target }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # GitHub-hosted runners have no IPv6, and the project's direct database host is
      # IPv6-only, so connect through the project's IPv4 connection pooler (session mode).
      - name: Resolve the pooler connection
        env:
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          pooler=$(curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/config/database/pooler")
          host=$(jq -r '(map(select(.database_type == "PRIMARY")) + .)[0].db_host' <<<"$pooler")
          user=$(jq -r '(map(select(.database_type == "PRIMARY")) + .)[0].db_user' <<<"$pooler")
          if [ -z "$host" ] || [ "$host" = null ]; then echo "No pooler found for $PROJECT_REF" >&2; exit 1; fi
          password=$(jq -rn --arg p "$SUPABASE_DB_PASSWORD" '$p | @uri')
          url="postgresql://$user:$password@$host:5432/postgres"
          echo "::add-mask::$password"
          echo "::add-mask::$url"
          echo "DB_URL=$url" >> "$GITHUB_ENV"
          echo "Pooler: $host (user $user)"
      - name: Migrations that would be applied
        run: npx supabase db push --dry-run --db-url "$DB_URL"
      - name: Apply migrations
        if: ${{ !inputs.dry_run }}
        run: npx supabase db push --yes --db-url "$DB_URL"
